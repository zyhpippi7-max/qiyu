server {
    listen 80;
    listen [::]:80;
    server_name xcx.qiyuai.com.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name xcx.qiyuai.com.cn;

    client_max_body_size 500M;
    access_log /var/log/nginx/xcx.qiyuai.com.cn.access.log;
    error_log /var/log/nginx/xcx.qiyuai.com.cn.error.log;

    ssl_certificate /etc/letsencrypt/live/xcx.qiyuai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcx.qiyuai.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # FFmpeg's WebAssembly core is larger than Wrangler's per-asset limit.
    # Serve it directly from Nginx while the editor itself remains browser-local.
    location ^~ /ffmpeg/ {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/ffmpeg/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        types {
            application/javascript js;
            application/wasm wasm;
        }
    }

    location = /download/QiyuAI-Mac-latest.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.7-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.7-Mac.dmg" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /download/QiyuAI-Windows-latest.exe {
        auth_basic off;
        return 302 https://github.com/zyhpippi7-max/qiyu/releases/download/v0.5.22/QiyuAI-0.5.22-x64.exe;
    }

    location = /download/QiyuAI-0.5.22-x64.exe {
        auth_basic off;
        return 302 https://github.com/zyhpippi7-max/qiyu/releases/download/v0.5.22/QiyuAI-0.5.22-x64.exe;
    }

    location = /download/QiyuAI-0.5.7-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.7-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.7-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.5.7-x64.exe {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.7-x64.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.7-x64.exe" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.5.0-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.0-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.0-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.5.1-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.1-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.1-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.5.2-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.2-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.2-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.5.0-x64.exe {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.5.0-x64.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.5.0-x64.exe" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.4.0-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.4.0-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.4.0-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.3.0-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.3.0-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.3.0-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.2.0-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.2.0-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.2.0-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /download/QiyuAI-0.2.1-arm64.dmg {
        auth_basic off;
        alias /var/www/xcx.qiyuai.com.cn/downloads/QiyuAI-0.4.0-arm64.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment; filename=QiyuAI-0.4.0-arm64.dmg" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 电脑助手使用自身设备令牌；创建控制任务仍由应用层校验管理员凭据。
    location = /api/automation {
        auth_basic off;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
